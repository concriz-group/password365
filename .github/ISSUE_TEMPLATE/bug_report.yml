name: Bug report
description: Something in Password365 does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! **Never paste passwords, your Secret Key, your master password or
        vault files here** — issues are public. Security problems go to
        [a private report](https://github.com/remofurlanetto/password365/security/advisories/new) instead.
  - type: dropdown
    id: app
    attributes:
      label: Where
      options: [Desktop app, Browser extension, iPhone or iPad, Sync between devices, Website, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Password365 version
      description: Settings › About shows it.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "macOS 15.2 / Windows 11 / Ubuntu 24.04 / iOS 18.1 — and the browser, for the extension"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots help — make sure they show no secrets.
