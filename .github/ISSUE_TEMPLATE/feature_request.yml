name: Suggest an improvement
description: An idea for a new feature or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem, in your words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Password365 help?
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How other apps do it, screenshots, links.
