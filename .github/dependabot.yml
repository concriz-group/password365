# Weekly dependency updates, grouped so a week is one pull request per ecosystem.
# cargo-deny (see core/deny.toml) still decides what is allowed.
version: 2
updates:
  - package-ecosystem: github-actions   # pinned by commit SHA in the workflows
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /core
    # These libraries change their API in each 0.x release; moving needs code changes and tests (the vault
    # database, the SSH agent, the pairing code). Done on purpose, not by a bot. Review: 2026-11-23.
    ignore:
      - { dependency-name: rusqlite }
      - { dependency-name: mdns-sd }
      - { dependency-name: ssh-encoding }
      - { dependency-name: signature }
      - { dependency-name: rand_core }
      - { dependency-name: qrcode }
    schedule: { interval: weekly }
    groups: { rust: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    # These libraries change their API in each 0.x release; moving needs code changes and tests (the vault
    # database, the SSH agent, the pairing code). Done on purpose, not by a bot. Review: 2026-11-23.
    ignore:
      - { dependency-name: rusqlite }
      - { dependency-name: mdns-sd }
      - { dependency-name: ssh-encoding }
      - { dependency-name: signature }
      - { dependency-name: rand_core }
      - { dependency-name: qrcode }
    schedule: { interval: weekly }
    groups: { tauri: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly }
    groups: { desktop: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /extension
    schedule: { interval: weekly }
    groups: { extension: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups: { site: { patterns: ["*"] } }
