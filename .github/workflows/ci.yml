name: CI

# Manual only (Actions tab › CI › Run workflow) until the product is ready.
# To run on every push again, add:  push: { branches: [main] }
# Also run by the release workflow before anything is built or published.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # toolchain input below
        with:
          toolchain: "1.96.0" # same as local development; raise deliberately
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # toolchain input below
        with:
          toolchain: "1.96.0" # same as local development; raise deliberately
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # toolchain input below
        with:
          toolchain: "1.96.0" # same as local development; raise deliberately
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8bf69897abc26b921431feaaa8ca2b47a6c30c00 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      # Project rule: at least 90 % line coverage.
      - run: cargo llvm-cov --workspace --fail-under-lines 90 --lcov --output-path lcov.info

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@9c67a826e39827395bfa619cd85cb2aaeb43cfaa # v2
        with:
          manifest-path: core/Cargo.toml

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage # thresholds: 90 % lines/functions/statements
      - run: npm run build

  desktop-e2e:
    # The desktop UI in a real browser against the in-memory demo backend (no Tauri).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report

  desktop-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # toolchain input below
        with:
          toolchain: "1.96.0" # same as local development; raise deliberately
          components: clippy
      - name: Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontend bundle for generate_context! and the browser helper (externalBin)
        run: |
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          mkdir -p binaries && touch binaries/password365-host-x86_64-unknown-linux-gnu
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage # thresholds: 90 % lines/functions/statements
      - run: npm run build
