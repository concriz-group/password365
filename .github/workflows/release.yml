name: Release

# Builds the desktop installers for macOS, Windows and Linux and, for a tag,
# publishes them as a GitHub release with the signed update bundles and
# `latest.json`, which the app's updater reads from the newest release:
#   https://github.com/concriz-group/password365/releases/latest/download/latest.json
# File names stay the same from one release to the next (Password365-macOS.dmg…),
# so the website links to releases/latest/download/<name>.
#
# Release: add the version's section to CHANGELOG.md, set the same version in
# apps/desktop/src-tauri/tauri.conf.json, then  git tag v0.2.0 && git push origin v0.2.0.
# Run from the Actions tab (no tag): builds the installers only, as workflow artifacts.
#
# Secrets (repository settings › Secrets and variables › Actions), see scripts/release/README.md:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   the update signing key
#   APPLE_CERTIFICATE (base64 .p12 of the Developer ID Application certificate), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_API_KEY (key id), APPLE_API_ISSUER, APPLE_API_KEY_P8 (contents of the .p8)
#                                    macOS signing and notarization; without them the macOS build is unsigned
# Without them the installers are built but carry no update bundle.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every test, lint and dependency check (cargo deny) passes before anything
  # is built or published.
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        name: The app's version (and the tag, when there is one, must match it)
        run: |
          version=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the app's version $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # toolchain input below
        with:
          toolchain: "1.96.0" # same as local development; raise deliberately
          targets: ${{ matrix.rust_targets }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev patchelf
      - run: npm ci
      - name: macOS signing and notarization (Developer ID)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "::error::a release needs the Apple secrets (scripts/release/README.md)"; exit 1
            fi
            echo "::warning::no Apple secrets: this macOS build is not signed or notarized"
          else
            # Tauri signs with the Developer ID certificate and notarizes with the API key.
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi
      - name: Build (and sign the update bundle when the key is set)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "::error::a release needs the update signing key (scripts/release/README.md)"; exit 1
            fi
            # A test build: a throwaway key just so the app builds; no update bundles, nothing published.
            echo "::warning::no update signing key: test build with a throwaway updater key"
            npx tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key" >/dev/null
            # In this runner's checkout only (never committed): the throwaway public key, no update bundles.
            PUB_FILE="$RUNNER_TEMP/throwaway.key.pub" node -e '
              const fs = require("fs"), file = "src-tauri/tauri.conf.json";
              const conf = JSON.parse(fs.readFileSync(file, "utf8"));
              conf.plugins.updater.pubkey = fs.readFileSync(process.env.PUB_FILE, "utf8").trim();
              conf.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(file, JSON.stringify(conf, null, 2));'
          fi
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect the installers and update bundles under stable names
        run: |
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          take() { for f in $(find "$root" -maxdepth 2 -type f -name "$1"); do cp "$f" "$out/$2"; done; }
          take '*.dmg' Password365-macOS.dmg
          take '*.app.tar.gz' Password365-macOS.app.tar.gz
          take '*.app.tar.gz.sig' Password365-macOS.app.tar.gz.sig
          take '*-setup.exe' Password365-Windows-setup.exe
          take '*-setup.exe.sig' Password365-Windows-setup.exe.sig
          take '*.msi' Password365-Windows.msi
          take '*.AppImage' Password365-Linux.AppImage
          take '*.AppImage.sig' Password365-Linux.AppImage.sig
          take '*.deb' Password365-Linux.deb
          ls -la "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  extension:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Store packages (Chrome Web Store / Edge Add-ons, and Firefox Add-ons)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          (cd dist && zip -qr "$GITHUB_WORKSPACE/out/Password365-extension-Chromium.zip" .)
          (cd dist-firefox && zip -qr "$GITHUB_WORKSPACE/out/Password365-extension-Firefox.zip" .)
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: out/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles
          merge-multiple: true
      - name: What changed (CHANGELOG.md) and the update manifest
        run: |
          python3 scripts/release/latest_json.py notes "$VERSION" CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          if ls bundles/*.sig >/dev/null 2>&1; then
            python3 scripts/release/latest_json.py manifest "$VERSION" bundles \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION" CHANGELOG.md > bundles/latest.json
            cat bundles/latest.json
          else
            echo "::error::no signed update bundles: a release must carry them" >&2; exit 1
          fi
      - name: GitHub release
        run: gh release create "v$VERSION" bundles/* --title "Password365 $VERSION" --notes-file notes.md --verify-tag
