[package]
name = "password365-ssh"
description = "SSH agent protocol for Password365: serves the vault's SSH keys to ssh and git"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Ed25519 only: the RSA and ECDSA stacks have open timing advisories
# (RUSTSEC-2023-0071 in rsa, RUSTSEC-2026-0387 in crypto-bigint 0.5).
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "encryption"] }
ssh-encoding = { version = "0.3.0", features = ["alloc"] }
signature = "3.0.0"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile.workspace = true

[lints]
workspace = true
