# cargo-deny policy: known vulnerabilities, licenses and sources.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is "unmaintained" (a notice, not a vulnerability). It only comes with the KeePass
    # reader (keepass 0.14 to 0.17 all use it), which reads database dates. Revisit when keepass
    # drops it.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "GPL-3.0-or-later",
    # HTTPS for the opt-in breach check (rustls, ring, webpki): permissive, GPL-compatible.
    "ISC",
    # Mozilla's CA certificate list (webpki-roots): permissive data licence.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
